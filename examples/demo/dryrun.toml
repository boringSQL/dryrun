[project]
id = "demo"

[default]
profile = "offline"

[profiles.offline]
schema_file = ".dryrun/schema.json"
database_id = "demo-offline"

[profiles.dev]
db_url = "${DATABASE_URL}"
database_id = "demo-dev"

[conventions]
min_severity = "warning"

[conventions.disabled_rules]
rules = ["naming/fk_pattern", "naming/index_pattern", "constraints/unnamed"]
